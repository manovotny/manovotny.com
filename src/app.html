<!doctype html>
<html
  class="bg-bg text-ink font-sans text-base leading-[1.7] scheme-light-dark"
  lang="en"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/icon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/icon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0a0c"
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/MonaSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/IBMPlexMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    %sveltekit.head%
    <script type="speculationrules">
      {
        "prerender": [
          { "where": { "href_matches": "/*" }, "eagerness": "moderate" }
        ]
      }
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body class="antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
